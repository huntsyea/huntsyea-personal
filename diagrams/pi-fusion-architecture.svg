<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
  <title id="title">Pi-Fusion architecture and provider boundary</title>
  <desc id="desc">The local Pi session contains user configuration, the active model, and the Pi-Fusion runtime. Pi-Fusion sends the task and optional context or tool output to independent panel models and a judge at external model providers. Panel answers and structured judge analysis return to the runtime, which gives compact evidence to the active model.</desc>
  <defs>
    <style>
      :root { color-scheme: light dark; }
      .background { fill: #ffffff; }
      .boundary { fill: none; stroke: #d5d5d5; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .box { fill: #fafafa; stroke: #dddddd; stroke-width: 1.5; }
      .runtime { fill: #f6f6f6; stroke: #bdbdbd; stroke-width: 1.5; }
      .rule { stroke: #dddddd; stroke-width: 1; }
      .arrow { fill: none; stroke: #a3a3a3; stroke-width: 1.5; marker-end: url(#arrowhead); }
      .return { fill: none; stroke: #777777; stroke-width: 1.5; marker-end: url(#arrowhead-strong); }
      .lane { font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #777777; letter-spacing: 0.1em; }
      .label { font: 500 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #171717; }
      .body { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #666666; }
      .small { font: 400 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #777777; }
      .step { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #3f3f3f; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #111111; }
        .boundary { stroke: #3a3a3a; }
        .box { fill: #171717; stroke: #303030; }
        .runtime { fill: #1b1b1b; stroke: #4a4a4a; }
        .rule { stroke: #303030; }
        .arrow { stroke: #5c5c5c; }
        .return { stroke: #999999; }
        .lane { fill: #8f8f8f; }
        .label { fill: #ededed; }
        .body { fill: #aaaaaa; }
        .small { fill: #909090; }
        .step { fill: #d0d0d0; }
      }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a3a3a3" />
    </marker>
    <marker id="arrowhead-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777777" />
    </marker>
  </defs>

  <rect class="background" width="760" height="600" />

  <text class="lane" x="44" y="38">LOCAL PI SESSION</text>
  <rect class="boundary" x="32" y="52" width="430" height="506" rx="12" />

  <text class="lane" x="500" y="38">MODEL PROVIDERS</text>
  <rect class="boundary" x="486" y="52" width="242" height="506" rx="12" />

  <rect class="box" x="56" y="82" width="174" height="126" rx="10" />
  <text class="label" x="76" y="111">User configuration</text>
  <text class="body" x="76" y="139">Panel and judge</text>
  <text class="body" x="76" y="161">Budgets and reasoning</text>
  <text class="body" x="76" y="183">Context and tool policy</text>

  <rect class="box" x="262" y="82" width="174" height="126" rx="10" />
  <text class="label" x="282" y="111">Active model</text>
  <text class="body" x="282" y="139">Supplies the task</text>
  <text class="body" x="282" y="161">Receives the evidence</text>
  <text class="body" x="282" y="183">Writes the final answer</text>

  <path class="arrow" d="M 143 208 L 143 250 L 194 250 L 194 278" />
  <path class="arrow" d="M 349 208 L 349 250 L 298 250 L 298 278" />

  <rect class="runtime" x="56" y="278" width="380" height="260" rx="10" />
  <text class="label" x="76" y="310">Pi-Fusion runtime</text>
  <line class="rule" x1="76" y1="328" x2="416" y2="328" />
  <text class="step" x="76" y="356">1  Resolve the panel, judge, and limits</text>
  <text class="step" x="76" y="389">2  Build the task and optional recent context</text>
  <text class="step" x="76" y="422">3  Run independent panel calls</text>
  <text class="step" x="76" y="455">4  Parse judge JSON and handle partial failure</text>
  <text class="step" x="76" y="488">5  Return analysis and short excerpts</text>

  <text class="small" x="510" y="90">OUTBOUND</text>
  <text class="body" x="510" y="115">Task, optional context,</text>
  <text class="body" x="510" y="136">and enabled tool output</text>
  <text class="small" x="510" y="170">RETURN</text>
  <text class="body" x="510" y="195">Panel answers and</text>
  <text class="body" x="510" y="216">judge analysis</text>

  <rect class="box" x="510" y="248" width="194" height="182" rx="10" />
  <text class="label" x="530" y="277">Independent panel</text>
  <rect class="box" x="530" y="296" width="154" height="34" rx="7" />
  <text class="body" x="607" y="318" text-anchor="middle">Model A</text>
  <rect class="box" x="530" y="342" width="154" height="34" rx="7" />
  <text class="body" x="607" y="364" text-anchor="middle">Model B</text>
  <rect class="box" x="530" y="388" width="154" height="34" rx="7" />
  <text class="body" x="607" y="410" text-anchor="middle">Model C</text>

  <rect class="box" x="510" y="450" width="194" height="88" rx="10" />
  <text class="label" x="530" y="479">Judge model</text>
  <text class="body" x="530" y="505">Returns structured JSON</text>

  <path class="arrow" d="M 436 342 L 510 342" />
  <path class="return" d="M 510 410 L 436 410" />
  <path class="arrow" d="M 436 470 L 510 470" />
  <path class="return" d="M 510 516 L 436 516" />
</svg>
