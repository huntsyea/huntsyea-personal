name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine verification scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
          if test -n "$changed_files" && ! printf '%s\n' "$changed_files" | grep -qv '^content/'; then
            echo "content_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "content_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        if: steps.scope.outputs.content_only != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify published content
        if: steps.scope.outputs.content_only == 'true'
        run: pnpm exec vitest run "tests/unit/published-content.test.ts"
        env:
          CI: true
          SITE_URL: https://example.com

      - name: Run complete verification
        if: steps.scope.outputs.content_only != 'true'
        run: pnpm run verify
        env:
          CI: true
          SITE_URL: https://example.com

      - name: Verify checks did not rewrite the checkout
        run: test -z "$(git status --porcelain)"
